name: LinguaMate
options:
  bundleIdPrefix: app.linguamate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  LinguaMateCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  LinguaMate:
    type: application
    platform: iOS
    sources:
      - LinguaMate
    dependencies:
      - package: LinguaMateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.linguamate.personal
        INFOPLIST_FILE: LinguaMate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LinguaMateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LinguaMateUITests
    dependencies:
      - target: LinguaMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LinguaMate:
    build:
      targets:
        LinguaMate: all
        LinguaMateUITests: [test]
    test:
      targets:
        - LinguaMateUITests
